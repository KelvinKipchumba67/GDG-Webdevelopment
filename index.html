<!DOCTYPE html>
<html lang="en">
<head>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finpay </title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <style>
        .hero-section{
            flex: 1;
        }
        .main{
            display: flex;
            align-items: center;
            padding: 60px 8% 100px;
            gap: 40px;
            margin: 0 auto;
        }
        .hero-title{
           font-size: 72px; 
           line-height: 1.1;
           margin: 0 0 25px 0;
           font-weight: 800;
           letter-spacing: -3px;
           color: #0a1e26;
        }

        .hero-subtitle{
            font-size: 18px;
            line-height: 1.6;
            color: #5e6d72;
            margin-bottom: 45px;
            max-width: 500px;
        }
        .cta{
            display: flex;
            background: white;
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            max-width: 450px;
            margin-bottom: 80px;
        }
        .cta-input{
            flex: 1;
            border: none;
            padding: 0 20px;
            color: #0a1e26;
            font-size: 16px;
            outline: none;
        }
        .btn-primary{
            align-items: center;
            font-weight: 700;
            display: flex;
            gap: 7px;
            border-radius: 12px;
            padding: 14px 27px;
        }
        .logos{
            display: flex;
            gap: 40px;
            align-items: center;
            opacity: 0.8;
        }
        .Klarna{
            font-size: 26px;
            font-weight: 900;
            color: #0a2533;
            letter-spacing: -1.5px;

        }
        .coinbase{
            font-size: 26px;
            font-weight: 900;
            color: #0a2533;
            letter-spacing: -1.5px;

        }
        .instacart{
            font-size: 24px;
            font-weight: 900;
            color: #0a2533;
            letter-spacing: -1px;
        }

    </style>
    <main class="main">
        <div class="hero-section">
        <h1 class="hero-title">
            Get paid early  save automatically all your pay.
        </h1>
        <p class="hero-subtitle">
             Supports small businesses with simple invoicing, powerful integrations, and cash flow management tools. 
        </p>
        <div class="cta">
            <input type="email" placeholder="Your business email" class="cta-input">
            <button class="btn-primary">
                Get Started
            </button>
        </div>

        <div class="logos">
            <span class="Klarna">Klarna</span>
            <span class="coinbase">Coinbase</span>
            <span class="instacart">instacart</span>
        </div>

        <div class="illustration">
            <div class="invoice-card">
                <div class="profile">
                    <div class="profile-icon">
                        <div class="icon-ring">

                        </div>
                    </div>
                </div>
                <div class="profile-name">
                    Dipa Inhouse
                </div>
                <div class="profile-email">
                    dipainhouse@gmail.com
                </div>
            </div>
        
        </div>
        </div>
    </main>
</body>
</html>
